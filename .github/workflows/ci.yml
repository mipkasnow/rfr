name: CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      auth: ${{ steps.filter.outputs.auth }}
      api: ${{ steps.filter.outputs.api }}
      e2e: ${{ steps.filter.outputs.e2e }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - build.gradle
              - settings.gradle
              - gradle.properties
              - gradlew
              - gradle/**
            auth:
              - rfr-auth/**
            api:
              - rfr-api/**
            e2e:
              - rfr-e2e/**
            frontend:
              - rfr-gql-client/**
            workflow:
              - .github/workflows/ci.yml

  backend:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.auth == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - env:
          WORKFLOW: ${{ needs.changes.outputs.workflow }}
          SHARED: ${{ needs.changes.outputs.shared }}
          AUTH: ${{ needs.changes.outputs.auth }}
          API: ${{ needs.changes.outputs.api }}
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          tasks=()
          [[ $WORKFLOW == true ]] && SHARED=true
          [[ $SHARED == true || $AUTH == true ]] && tasks+=(:rfr-auth:build)
          [[ $SHARED == true || $API == true ]] && tasks+=(:rfr-api:build)
          [[ $SHARED == true || $E2E == true ]] && tasks+=(:rfr-e2e:testClasses)
          ./gradlew "${tasks[@]}"

  frontend:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
