plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

wrapper {
    gradleVersion = '9.7.1'
}


allprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

configure([project(':rfr-api'), project(':rfr-auth')]) {
    apply plugin: 'io.spring.dependency-management'

    ext {
        lombokVersion = '1.18.48'
        mysqlDriverVersion = '8.0.33'
        flywayVersion = '13.7.0'
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
        }
    }
}

tasks.register('runAll') {
    group = 'application'
    description = 'Runs rfr-auth and rfr-api'
    dependsOn ':rfr-auth:bootRun', ':rfr-api:bootRun'
}

def waitForStand = tasks.register('waitForStand', Exec) {
    group = 'verification'
    description = 'Waits until MySQL, rfr-auth, rfr-api and the front respond'
    workingDir = rootProject.projectDir
    commandLine 'scripts/wait-for-stand.sh'
}

tasks.register('e2e') {
    group = 'verification'
    description = 'Runs rfr-e2e tests'
    dependsOn waitForStand, ':rfr-e2e:test'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}
